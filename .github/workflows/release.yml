name: release-on-tag
run-name: Build and release on tag
permissions:
  contents: write
on:
  push:
    tags:
      - v**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # The version the card logs comes from package.json, so a tag that
      # disagrees with it would ship a bundle reporting the wrong version.
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($expected)"
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Check if tag is a prerelease
        id: check-tag
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
          else
              echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.check-tag.outputs.prerelease }}
          files: |
            dist/tailwind-template-card.js
